name: Svelte migration checks

on:
  pull_request:
    paths:
      - "examples/with-svelte/**"
      - ".github/workflows/svelte-migration.yml"
      - "SVELTE_MIGRATION.md"
  push:
    branches:
      - feature/svelte-migration-phase-1
    paths:
      - "examples/with-svelte/**"
      - ".github/workflows/svelte-migration.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          cache: yarn
      - name: Dependencies
        run: yarn install --non-interactive
      - name: Build monorepo packages
        run: yarn build:packages
      - name: Svelte type checks
        run: yarn --cwd examples/with-svelte typecheck
      - name: Native scene tests
        run: yarn --cwd examples/with-svelte test
      - name: Production bundle
        run: yarn --cwd examples/with-svelte build
      - name: Print formatted Svelte migration sources
        if: always()
        run: |
          ./node_modules/.bin/prettier --write examples/with-svelte/src/native/scene.ts examples/with-svelte/src/native/scene.test.ts examples/with-svelte/README.md SVELTE_MIGRATION.md
          node -e 'const fs = require("fs"); for (const p of ["examples/with-svelte/src/native/scene.ts","examples/with-svelte/src/native/scene.test.ts","examples/with-svelte/README.md","SVELTE_MIGRATION.md"]) console.log("FORMATTED_FILE:"+p+"::"+fs.readFileSync(p).toString("base64"))'
